<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中国近现代史纲要 · PDT题库练习</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e0e7ff 100%);
            color: #1e293b;
            line-height: 1.6;
            padding: 16px 12px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            padding: 24px 20px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            background: #f8fafc;
            padding: 14px 20px;
            font-size: 14.5px;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }
        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .num { color: #2563eb; font-weight: 700; }

        /* 分类筛选 - 移动端友好 */
        .filter-area {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .filter-area::-webkit-scrollbar { display: none; }
        .filter-area label {
            font-weight: 600;
            color: #475569;
            margin-right: 10px;
            display: inline-block;
        }
        .filter-btn {
            display: inline-block;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 9px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-right: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { background: #e2e8f0; }
        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .question-card {
            margin: 16px 20px;
            background: white;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
        }
        .q-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .q-number {
            background: #eff6ff;
            color: #2563eb;
            padding: 4px 14px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 14px;
        }
        .q-tag {
            font-size: 13px;
            background: #f1f5f9;
            padding: 3px 12px;
            border-radius: 9999px;
            color: #475569;
        }
        .q-text {
            font-size: 17.5px;
            font-weight: 500;
            line-height: 1.65;
            margin-bottom: 20px;
            color: #1e293b;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-item {
            padding: 14px 18px;
            background: #fafcff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            min-height: 56px;
            display: flex;
            align-items: center;
        }
        .option-item:hover {
            border-color: #93c5fd;
            background: #f0f9ff;
        }
        .option-item.selected-correct { background: #ecfdf5; border-color: #10b981; }
        .option-item.selected-wrong { background: #fef2f2; border-color: #ef4444; }
        .option-item.show-correct { background: #ecfdf5; border-color: #10b981; }

        .feedback {
            margin-top: 16px;
            padding: 16px;
            border-radius: 16px;
            font-size: 15.5px;
        }
        .feedback.correct { background: #ecfdf5; color: #065f46; border-left: 5px solid #10b981; }
        .feedback.wrong { background: #fef2f2; color: #991b1b; border-left: 5px solid #ef4444; }

        .analysis {
            margin-top: 16px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 16px;
            border-left: 5px solid #64748b;
            font-size: 15.5px;
            line-height: 1.7;
        }

        .footer-note {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14.5px;
        }

        @media (max-width: 640px) {
            .question-card { margin: 14px 12px; padding: 18px; }
            .q-text { font-size: 16.5px; }
            h1 { font-size: 24px; padding: 20px 16px 12px; }
        }

        @media (min-width: 768px) {
            body { padding: 24px; }
            .question-card { margin: 20px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>
        <span>📖 中国近现代史纲要 PDT题库</span>
        <span style="font-size: 15px; font-weight: 500; color: #64748b;">共 <span id="totalCount">0</span> 题</span>
    </h1>

    <div class="stats-bar">
        <span>📌 进度：<span id="progressText">0/0</span></span>
        <span>✅ 正确率：<span id="accuracyText">0%</span></span>
        <span>📝 已答：<span id="answeredCount">0</span></span>
    </div>

    <div class="filter-area">
        <label>🏷️ 分类：</label>
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="五四运动与新文化运动">五四运动</button>
        <button class="filter-btn" data-filter="中国共产党的成立与早期革命">中共成立</button>
        <button class="filter-btn" data-filter="土地革命与武装斗争">土地革命</button>
        <button class="filter-btn" data-filter="抗日战争">抗日战争</button>
        <button class="filter-btn" data-filter="解放战争">解放战争</button>
        <button class="filter-btn" data-filter="新中国建设与社会主义改造">新中国建设</button>
        <button class="filter-btn" data-filter="改革开放与新时代">改革开放</button>
        <button class="filter-btn" data-filter="其他">其他</button>
    </div>

    <div id="questionList"></div>
    <div class="footer-note">💡 点击选项自动显示答案和解析 • 支持手机、平板、电脑</div>
</div>

<script>
    (function() {
        // 把你所有题目放入这里（已去掉多余嵌套）
        const allQuestions = [ { "id": 1, "type": "单选题", "text": "1922年5月5日至10日，中国社会主义青年团第一次全国代表大会在（）召开，中国社会主义青年团宣告成立。", "options": ["A. 广州", "B. 上海", "C. 北京", "D. 天津"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1922年5月5日至10日，中国社会主义青年团第一次全国代表大会在广州东园召开，标志着中国社会主义青年团（后改称中国共产主义青年团）的正式成立。选择广州而非上海、北京等地，是因为当时广州的革命氛围较为浓厚，且与孙中山领导的国民党合作环境较好。" },
    { "id": 2, "type": "判断题", "text": "1927年大革命失败后，国民党政府实行一党专政和军事独裁统治。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1927年大革命失败后，以蒋介石为首的国民党右派发动“四一二”反革命政变，随后在南京建立国民政府，实行国民党一党专政和军事独裁统治，排斥共产党和其他民主力量。" },
    { "id": 3, "type": "判断题", "text": "1917年俄国爆发的十月革命，推动了中国的先进分子把研究的目光从资产阶级民主主义转向社会主义。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1917年俄国十月革命的成功，给中国先进分子带来了新的希望，使他们认识到资产阶级民主主义道路在中国难以走通，转而接受和关注社会主义思想，推动了马克思主义在中国的传播。" },
    { "id": 4, "type": "判断题", "text": "统一战线对中国革命来说是极为重要的。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "统一战线是中国共产党在中国革命中战胜敌人的“三大法宝”之一。通过团结一切可以团结的力量，包括工人、农民、小资产阶级和民族资产阶级，中国革命得以汇聚强大力量。" },
    { "id": 5, "type": "判断题", "text": "中国国民党是第一次国共合作的倡导者和革命统一战线的组织者。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "第一次国共合作的倡导者和组织者是中国共产党，而不是中国国民党。1923年中共三大决定与国民党合作，共产党员以个人身份加入国民党，帮助国民党改组。国民党在共产国际和中共帮助下才确定了联俄、联共、扶助农工政策。" },
    { "id": 6, "type": "判断题", "text": "洋务事业的指导思想，总结为“中学为体，西学为用”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "洋务运动的指导思想是“中学为体，西学为用”（简称“中体西用”），即在不改变中国封建制度的前提下，学习西方先进的科学技术，以维护清朝统治。这一思想最早由冯桂芬提出，后成为洋务派的理论纲领。" },
    { "id": 7, "type": "判断题", "text": "中共七大形成了以毛泽东同志为核心的第一代中央领导集体", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "第一代中央领导集体的形成可追溯到遵义会议（1935年）前后，中共七大（1945年）是这一集体的成熟和确立的标志。若表述为“七大形成了”这一集体，则不够准确，因为核心领导地位在遵义会议后已经逐步确立。故判错。" },
    { "id": 8, "type": "判断题", "text": "百团大战打破了日军不可战胜的神话", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "打破日军不可战胜神话的是平型关大捷（1937年9月），而非百团大战。百团大战（1940年）是八路军在华北发动的大规模破袭战，沉重打击了日军，但此时日军不可战胜的神话早已被打破。" },
    { "id": 9, "type": "判断题", "text": "1956年中共八大完整概括了中国共产党在社会主义初级阶段“一个中心、两个基本点”的基本路线。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "中共八大（1956年）正确分析了国内主要矛盾，提出要集中力量发展社会生产力。但“一个中心、两个基本点”的基本路线是在1987年中共十三大上完整概括的，不是八大提出的。" },
    { "id": 10, "type": "判断题", "text": "“天京事变”是太平天国革命失败的根本原因。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "“天京事变”（1856年）是太平天国由盛转衰的转折点，但不是革命失败的根本原因。太平天国失败的根本原因是农民阶级的局限性（缺乏科学理论指导、无法克服自身弱点）以及中外反动势力的联合镇压。" },
    { "id": 11, "type": "判断题", "text": "“一国两制”构想首先被运用于解决香港、澳门回归祖国问题。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "“一国两制”构想首先用于解决香港问题（中英谈判，1982—1984年），随后用于澳门。香港于1997年回归，澳门于1999年回归。但邓小平最初提出“一国两制”是针对台湾问题，而首先实践于香港。" },
    { "id": 12, "type": "判断题", "text": "十月革命中，俄国号召反对帝国主义，并以新的平等态度对待中国，有力推动了社会主义思潮在中国的传播。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "十月革命后，苏俄政府宣布废除沙皇同中国签订的不平等条约，并号召反对帝国主义，这对中国先进分子产生了巨大吸引力，有力推动了社会主义思潮在中国的传播。" },
    { "id": 13, "type": "判断题", "text": "党的十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "1978年12月召开的党的十一届三中全会，重新确立了解放思想、实事求是的思想路线，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，是新中国成立以来党的历史上具有深远意义的伟大转折。" },
    { "id": 14, "type": "判断题", "text": "清末新政时期，清政府废除科举制、兴办新式学堂，这与现代我国推行教育改革、促进教育现代化的初衷和效果完全相同。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "清末新政废除科举、兴办新式学堂，虽然形式上与现代教育改革有相似之处，但其根本目的是维护封建专制统治，而不是促进教育现代化。两者在性质、目的和效果上完全不同。" },
    { "id": 15, "type": "判断题", "text": "在《海国图志》中，魏源提出了“师夷长技以制夷”的思想。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "魏源在《海国图志》中明确提出了“师夷长技以制夷”的思想，主张学习西方先进的军事技术以抵御外国侵略，成为近代中国向西方学习的先声。" },
    { "id": 16, "type": "判断题", "text": "康有为属于维新思想代表人物之一。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "康有为是戊戌维新运动的领袖人物，与梁启超、谭嗣同等人共同倡导变法维新，是维新派的主要代表人物之一。" },
    { "id": 17, "type": "判断题", "text": "在中国率先举起马克思主义旗帜的是陈独秀。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "在中国率先举起马克思主义旗帜的是李大钊，而非陈独秀。李大钊于1918—1919年发表《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》《我的马克思主义观》等文章，系统介绍马克思主义。陈独秀后来也成为马克思主义者，但晚于李大钊。" },
    { "id": 18, "type": "判断题", "text": "农民阶级不是新的生产力和生产关系的代表，他们无法克服小生产者所固有的阶级局限性。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "农民阶级由于是小生产者，受其经济地位限制，具有分散性、保守性和狭隘性等固有阶级局限性，无法代表新的生产力和生产关系，因此不能领导中国革命取得胜利。太平天国、义和团等农民运动的失败都证明了这一点。" },
    { "id": 19, "type": "判断题", "text": "太平天国起义沉重打击了封建统治阶级，强烈撼动了清政府的统治根基。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国起义（1851—1864年）规模宏大，历时14年，席卷大半个中国，沉重打击了清王朝的封建统治，动摇了其统治根基，是中国旧式农民战争的最高峰。" },
    { "id": 20, "type": "判断题", "text": "中国共产党是一个以马克思列宁主义理论为基础的政党。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党从成立之初就以马克思列宁主义为理论基础，是在马克思主义指导下建立的无产阶级政党，始终坚持用马克思主义理论武装全党。" },
    { "id": 21, "type": "判断题", "text": "1954年，中华人民共和国第一届全国人民代表大会第一次会议在北京召开，大会讨论并通过《中华人民共和国宪法》。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "1954年9月，第一届全国人民代表大会第一次会议在北京召开，大会通过了《中华人民共和国宪法》，这是新中国第一部社会主义类型的宪法，确立了人民代表大会制度。" },
    { "id": 22, "type": "判断题", "text": "毛泽东思想是马克思主义中国化时代化的第一次历史性飞跃。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "毛泽东思想是马克思主义基本原理与中国具体实际相结合的第一次历史性飞跃，是中国共产党集体智慧的结晶，指导中国革命取得了胜利。" },
    { "id": 23, "type": "判断题", "text": "七七事变标志着日本全面侵华的开始。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1937年7月7日（七七事变，又称卢沟桥事变），日本帝国主义发动全面侵华战争，标志着中国全国性抗日战争的开始。" },
    { "id": 24, "type": "判断题", "text": "中共一大选举李达为书记。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "中共一大选举陈独秀为中央局书记（当时不称“主席”或“书记”），而非李达。李达虽是一大代表，并被选为中央局成员（负责宣传），但书记是陈独秀。" },
    { "id": 25, "type": "判断题", "text": "1947年10月10日，中国人民解放军总部发表宣言，提出“打倒蒋介石，解放全中国”的口号。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1947年10月10日，中国人民解放军总部发表宣言，正式提出“打倒蒋介石，解放全中国”的口号，标志着解放战争进入战略进攻阶段。" },
    { "id": 26, "type": "判断题", "text": "《民报》和清华大学成为了新文化运动的主要阵地。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "新文化运动的主要阵地是《新青年》杂志和北京大学，而非《民报》和清华大学。《民报》是同盟会的机关报，属于辛亥革命时期的刊物。" },
    { "id": 27, "type": "判断题", "text": "在国民党统治区，以学生运动为先导的人民民主运动成为配合人民解放战争的第二条战线。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "解放战争时期，在国民党统治区，以学生运动为先导的人民民主运动迅速发展，形成了配合人民解放战争的第二条战线，对国民党统治造成了巨大压力。" },
    { "id": 28, "type": "判断题", "text": "《天朝田亩制度》是一个符合中国实际的社会改革方案。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "《天朝田亩制度》主张废除封建土地所有制，平均分配土地，但它是一个空想的社会改革方案，不符合当时中国实际，平分土地的主张根本无法实施，带有浓厚的小农平均主义色彩。" },
    { "id": 29, "type": "判断题", "text": "五四运动是中国新民主主义革命阶段的开端。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动（1919年）是中国新民主主义革命的开端，因为它具有彻底的反帝反封建性质，且中国工人阶级开始以独立姿态登上政治舞台。" },
    { "id": 30, "type": "判断题", "text": "戊戌维新运动的失败，主要是由于维新派自身的局限和以慈禧为首的强大的守旧势力的反对。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "戊戌维新运动失败的原因：一方面是维新派自身的局限性（不敢发动群众、依赖没有实权的光绪皇帝等），另一方面是以慈禧太后为首的封建守旧势力的强大反对。" },
    { "id": 31, "type": "判断题", "text": "中国封建社会政治的基本特征是实行高度中央集权的封建专制制度。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "中国封建社会在政治上实行高度中央集权的封建专制制度，皇帝拥有至高无上的权力，地方服从中央，形成了一套完整的官僚体系。" },
    { "id": 32, "type": "判断题", "text": "中日甲午战争时，清廷为筹办慈禧太后60岁生日庆典，除要求各级官员报效外，还提用户部饷银和边防经费，甚至挪用海军军费，这反映了当时社会制度的腐败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "甲午战争期间，清廷为筹备慈禧太后六十寿辰庆典，挪用户部银两和海军军费，导致北洋海军装备落后、弹药不足，反映了清朝统治集团的腐败和对国家命运的漠视。" },
    { "id": 33, "type": "判断题", "text": "五四运动是一次真正的群众运动。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动从学生扩展到工人、商人等各阶层，形成了全国范围的群众性反帝爱国运动，是一次真正的群众运动，工人阶级在其中发挥了决定性作用。" },
    { "id": 34, "type": "判断题", "text": "重庆谈判和政治协商会议斗争的焦点是革命的领导权问题。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "重庆谈判（1945年）和政治协商会议（1946年）斗争的焦点是军队和政权问题（即解放区政权和人民军队的地位问题），而非革命的领导权问题。领导权问题在国共斗争中是一贯的核心，但具体到这两次谈判，争议焦点更集中于军队国家化和解放区合法化。" },
    { "id": 35, "type": "判断题", "text": "维新派和守旧派论战的焦点是要不要以革命的手段推翻清王朝。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "维新派和守旧派论战的焦点是“要不要变法、要不要兴民权、要不要设议院、要不要废除八股”等，而非“要不要以革命手段推翻清王朝”。革命与改良的论战发生在革命派与改良派之间（20世纪初），而非维新派与守旧派之间。" },
    { "id": 36, "type": "判断题", "text": "《资政新篇》倡导鼓励发展资本主义工商业，主张自由通商，这表明它是一个具有资本主义色彩的治国方案。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《资政新篇》是洪仁玕提出的，主张学习西方，发展资本主义工商业，实行自由通商，具有鲜明的资本主义色彩，是太平天国后期的一个重要治国方案。" },
    { "id": 37, "type": "判断题", "text": "中国共产党在中国历史上第一个制定了可以付诸实施的比较完整的土地革命纲领和路线。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党在土地革命战争时期制定的土地政策（如《井冈山土地法》《兴国土地法》等），是中国共产党历史上第一个可以付诸实施的比较完整的土地革命纲领和路线，真正解决了农民的土地问题。" },
    { "id": 38, "type": "判断题", "text": "中共一大提出举行国共合作的决议。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "中共一大（1921年）并未提出国共合作的决议。国共合作是在中共三大（1923年）上正式决定的，确定了共产党员以个人身份加入国民党的合作方式。" },
    { "id": 39, "type": "判断题", "text": "1856年9月，发生了太平天国内部自相残杀的天京事变。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1856年9月，太平天国领导集团内部发生公开分裂，韦昌辉杀杨秀清，随后又被处死，石达开出走，这就是“天京事变”，严重削弱了太平天国的力量。" },
    { "id": 40, "type": "判断题", "text": "被誉为中国人民的大宪章、起着临时宪法作用的是《中国人民政治协商会议共同纲领》。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1949年9月，中国人民政治协商会议第一届全体会议通过的《中国人民政治协商会议共同纲领》，在当时起着临时宪法的作用，被誉为“中国人民的大宪章”。" },
    { "id": 41, "type": "判断题", "text": "中国早期的马克思主义者注重从中国实际出发，学习和运用马克思主义。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "中国早期的马克思主义者（如李大钊、陈独秀、毛泽东等）在传播马克思主义的过程中，注意结合中国实际，反对教条主义，强调马克思主义必须与中国国情相结合。" },
    { "id": 42, "type": "判断题", "text": "大革命失败后，国民党仍然是工人、农民、城市小资产阶级、民族资产阶级的革命联盟。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "大革命失败后，国民党在蒋介石领导下成为代表地主阶级、买办资产阶级利益的反动政党，不再是工人、农民、小资产阶级和民族资产阶级的革命联盟。国民党清党反共，大肆屠杀共产党员和革命群众。" },
    { "id": 43, "type": "判断题", "text": "1935年，日本在华北制造一系列事端，这就是华北事变。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1935年，日本帝国主义为扩大对中国的侵略，在华北地区制造了一系列事端（如《秦土协定》《何梅协定》等），史称“华北事变”，加剧了民族危机。" },
    { "id": 44, "type": "判断题", "text": "义和团运动是中国旧式农民战争的最高峰。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "中国旧式农民战争的最高峰是太平天国起义，而非义和团运动。义和团运动是反帝爱国运动，但其规模和制度远不及太平天国。" },
    { "id": 45, "type": "判断题", "text": "中国共产党著名的“三个法宝”指的是实事求是、武装斗争、民主团结。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党著名的“三个法宝”是统一战线、武装斗争、党的建设，由毛泽东在《〈共产党人〉发刊词》中提出。“实事求是”是党的思想路线核心，“民主团结”并非三大法宝之一。" },
    { "id": 46, "type": "判断题", "text": "解放战争时期，中共中央发出“五四指示”，确定“耕者有其田”的政策。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1946年5月4日，中共中央发布《关于土地问题的指示》（即“五四指示”），决定将抗日战争时期的减租减息政策改为“耕者有其田”的政策，推动了解放区的土地改革。" },
    { "id": 47, "type": "判断题", "text": "中国共产党的成立，使中国革命面貌焕然一新。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党的成立使中国革命有了坚强的领导核心、科学的指导思想（马克思主义）和新的革命方法，从此中国革命面貌焕然一新。" },
    { "id": 48, "type": "判断题", "text": "1940年八路军在华北发动的大规模破袭进攻战是百团大战。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1940年8月至12月，八路军在华北发动了大规模破袭进攻战，参战部队达100多个团，故称“百团大战”，沉重打击了日军的嚣张气焰。" },
    { "id": 49, "type": "判断题", "text": "太平天国起义具有不同于以往农民战争的新的历史特点。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国起义不同于以往农民战争的特点在于：它发生在半殖民地半封建社会的新的历史条件下，担负着反封建和反侵略的双重任务，并提出了《天朝田亩制度》等具有新特点的纲领。" },
    { "id": 50, "type": "判断题", "text": "1919年5月爆发的五四运动，改变了中国半殖民地半封建社会的性质，中国革命从此进入新民主主义革命时期。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "五四运动标志着中国新民主主义革命的开端，但并没有改变中国半殖民地半封建社会的性质。中国半殖民地半封建社会的性质直到1949年新中国成立才根本改变。" },
    { "id": 51, "type": "判断题", "text": "同盟会是近代中国第一个资产阶级革命的全国性政党。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1905年，孙中山在日本东京成立中国同盟会，这是近代中国第一个资产阶级革命的全国性政党，以“驱除鞑虏，恢复中华，创立民国，平均地权”为纲领。" },
    { "id": 52, "type": "判断题", "text": "中国人民革命的胜利和人民民主专政的新中国的创建，为实现中华民族伟大复兴创造了根本社会条件。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1949年中国人民革命的胜利和新中国的成立，推翻了帝国主义、封建主义和官僚资本主义的统治，为实现中华民族伟大复兴创造了根本社会条件。" },
    { "id": 53, "type": "判断题", "text": "洋务运动对外国具有依赖性、洋务运动的管理具有腐朽性。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "洋务运动对外国具有依赖性（依赖外国技术和设备），管理上具有腐朽性（封建衙门作风、贪污腐败），这些是其最终失败的重要原因。" },
    { "id": 54, "type": "判断题", "text": "列强并没有能够实现瓜分中国的图谋，其最根本的原因是帝国主义列强之间的矛盾和相互制约。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "列强没有实现瓜分中国图谋的最根本原因是中华民族不屈不挠的反侵略斗争，而非帝国主义列强之间的矛盾和相互制约。后者是外部因素，前者才是决定性的内因。" },
    { "id": 55, "type": "判断题", "text": "列强并没有能够实现瓜分中国的图谋，其最根本的原因是中华民族进行的不屈不挠的反侵略斗争。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "中华民族不屈不挠的反侵略斗争是列强未能瓜分中国的根本原因。中国人民的英勇反抗使侵略者认识到瓜分中国需要付出巨大代价，从而不敢轻易下手。" },
    { "id": 56, "type": "判断题", "text": "民生主义在当时指的是“平均地权”，也就是孙中山所说的社会革命。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "孙中山的三民主义中，民生主义的内容是“平均地权”，即通过核定地价、涨价归公等方法实现土地公有，孙中山称之为“社会革命”。" },
    { "id": 57, "type": "判断题", "text": "天津大学是新文化运动的主要阵地之一。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "新文化运动的主要阵地是北京大学和《新青年》杂志，而非天津大学。天津大学虽是中国近代著名学府，但不属于新文化运动的核心阵地。" },
    { "id": 58, "type": "判断题", "text": "维新派的代表人物有：康有为、梁启超、谭嗣同等。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "康有为、梁启超、谭嗣同是戊戌维新的主要代表人物，他们主张变法维新，实行君主立宪，是中国近代维新派的杰出代表。" },
    { "id": 59, "type": "判断题", "text": "资本-帝国主义列强对中国进行的经济侵略方式只有倾销商品。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "资本—帝国主义列强对中国的经济侵略方式多样，包括倾销商品、资本输出、控制通商口岸、夺取关税自主权、控制经济命脉等，绝非只有倾销商品一种。" },
    { "id": 60, "type": "判断题", "text": "太平天国农民起义有科学的指导思想。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "太平天国农民起义没有科学的指导思想。它是以拜上帝教为精神纽带，缺乏科学理论指导，这是其失败的重要原因之一。" },
    { "id": 61, "type": "判断题", "text": "戊戌维新运动表明，在半殖民地半封建的中国，统治者走自上而下的改良道路是可以行得通的。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "戊戌维新运动的失败证明，在半殖民地半封建的中国，统治者自上而下的改良道路是行不通的。不改变封建制度，只靠温和改良无法解决中国社会的根本矛盾。" },
    { "id": 62, "type": "判断题", "text": "《中国土地法大纲》规定废除封建性及半封建性剥削的土地制度。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1947年10月10日，中共中央公布《中国土地法大纲》，明确规定“废除封建性及半封建性剥削的土地制度，实行耕者有其田的土地制度”。" },
    { "id": 63, "type": "判断题", "text": "红军长征的胜利冲破了国民党军队的军事围剿，铸就了伟大的长征精神。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "红军长征（1934—1936年）冲破了国民党军队的围追堵截，胜利到达陕北，保存了革命力量，同时铸就了伟大的长征精神，成为中国革命转危为安的关键。" },
    { "id": 64, "type": "判断题", "text": "中法战争之后，先进的中国人开始睁开眼睛看世界。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "先进的中国人开始“睁开眼睛看世界”是在鸦片战争之后（以林则徐、魏源为代表），而非中法战争之后。中法战争（1883—1885年）已经是较晚的事件了。" },
    { "id": 65, "type": "判断题", "text": "1927年8月7日，中共中央为应对大革命失败的危机形势，在汉口召开紧急会议。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1927年8月7日，中共中央在汉口召开紧急会议（即八七会议），总结了大革命失败的教训，确定了土地革命和武装反抗国民党反动派的总方针。" },
    { "id": 66, "type": "判断题", "text": "国民党一大事实上确认了联俄、联共、扶助农工的三大革命政策，标志着第一次国共合作正式形成。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1924年1月，中国国民党第一次全国代表大会在广州召开，大会事实上确立了联俄、联共、扶助农工三大革命政策，标志着第一次国共合作的正式形成。" },
    { "id": 67, "type": "判断题", "text": "鸦片战争后，随着外国资本-帝国主义的入侵，中国封建社会逐步变成了半殖民地半封建社会。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1840年鸦片战争后，西方列强用武力打开中国大门，强迫清政府签订不平等条约，中国开始从封建社会逐步沦为半殖民地半封建社会。" },
    { "id": 68, "type": "判断题", "text": "五四运动促进了马克思主义在中国的传播及其与中国工人运动的结合。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动促进了马克思主义在中国的广泛传播，并使马克思主义与中国工人运动相结合，为中国共产党的成立作了思想和组织上的准备。" },
    { "id": 69, "type": "判断题", "text": "抗日战争期间，中国共产党领导开辟的敌后战场和国民党指挥的正面战场协力合作，形成了共同抗击日本侵略者的战略局面。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "抗日战争期间，中国共产党领导的敌后战场（八路军、新四军等）与国民党领导的正面战场相互配合，形成了共同抗击日本侵略者的战略局面。" },
    { "id": 70, "type": "判断题", "text": "民权主义包括“驱除鞑虏，恢复中华”两项内容。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "“驱除鞑虏，恢复中华”是同盟会纲领中民族主义的内容，而非民权主义。民权主义的内容是“创立民国”，即推翻封建专制制度，建立民主共和国。" },
    { "id": 71, "type": "判断题", "text": "三大战役的胜利标志着新民主主义革命的基本胜利。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "三大战役（辽沈、淮海、平津）的胜利消灭了国民党军队的主力，但新民主主义革命的基本胜利是以1949年10月1日新中国成立为标志的，而非三大战役。" },
    { "id": 72, "type": "判断题", "text": "洋务运动不可能为中国摆脱贫困找到出路，也不可能避免最终失败的命运。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "洋务运动在不改变封建制度的前提下，单纯学习西方技术，不可能为中国找到摆脱贫困的道路，甲午战争的惨败宣告了洋务运动的最终失败。" },
    { "id": 73, "type": "判断题", "text": "大革命时期的中国共产党还不善于将马克思列宁主义的基本原理与中国革命实践结合起来。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "大革命时期（1924—1927年），中国共产党还处于幼年时期，不善于将马克思列宁主义的基本原理与中国革命的具体实践相结合，这是大革命失败的重要原因之一。" },
    { "id": 74, "type": "判断题", "text": "在新三民主义中，民族主义并未明确突出反帝内容。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "在新三民主义中，民族主义明确突出了反对帝国主义的内容，并提出“中国民族自求解放”和“各民族一律平等”两大原则。" },
    { "id": 75, "type": "判断题", "text": "孙中山喊出了“振兴中华”的时代最强音。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "孙中山在1894年兴中会成立时，提出了“振兴中华”的口号，喊出了那个时代的时代最强音，激励了无数仁人志士为民族复兴而奋斗。" },
    { "id": 76, "type": "判断题", "text": "毛泽东在《论反对日本帝国主义的策略》中强调了工农武装割据的思想。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "毛泽东在《中国的红色政权为什么能够存在？》和《井冈山的斗争》中强调了工农武装割据的思想，而不是在《论反对日本帝国主义的策略》中。《论反对日本帝国主义的策略》主要阐述抗日民族统一战线问题。" },
    { "id": 77, "type": "判断题", "text": "解放战争时期，配合人民解放战争的第二条战线的是以学生运动为先导的人民民主运动。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "解放战争时期，国民党统治区以学生运动为先导的人民民主运动，形成了配合人民解放战争的第二条战线，给国民党政权以沉重打击。" },
    { "id": 78, "type": "判断题", "text": "控制中国的内政、外交，是外国侵略者对中国进行政治控制计划的一部分。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "外国侵略者通过一系列不平等条约，控制中国的内政、外交，干涉中国司法、海关等，这是其对中国进行政治控制的重要手段。" },
    { "id": 79, "type": "判断题", "text": "在对资本主义工商业改造过程中，国家对资本家采取了和平赎买政策。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "在社会主义改造过程中，国家对资本主义工商业实行和平赎买政策，通过公私合营、定息等方式，将资本主义工商业逐步改造为社会主义国营经济。" },
    { "id": 80, "type": "判断题", "text": "《天朝田亩制度》中的平分土地方案均得到了实施。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "《天朝田亩制度》中提出的平分土地方案只是理想化的设计，在当时并未得到真正实施，由于战争环境和农民阶级的局限性，这一方案无法实际推行。" },
    { "id": 81, "type": "判断题", "text": "林则徐提出“师夷长技以制夷”的思想。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "提出“师夷长技以制夷”思想的是魏源，而非林则徐。林则徐是近代中国“睁眼看世界的第一人”，但这一口号是魏源在《海国图志》中明确提出的。" },
    { "id": 82, "type": "判断题", "text": "1926—1927年进行的北伐战争的主要目的是为了推翻袁世凯的独裁统治。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "北伐战争（1926—1927年）的主要目的是打倒北洋军阀（吴佩孚、孙传芳、张作霖等），统一中国，而非推翻袁世凯的独裁统治。袁世凯已于1916年去世。" },
    { "id": 83, "type": "判断题", "text": "清末著名诗人丘逢甲在《春愁》中写道：“春愁难遣强看山，往事惊心泪欲潸，四万万人同一哭，去年今日割台湾。”诗中“往事”指甲午中日战争的失败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "丘逢甲《春愁》中的“去年今日割台湾”指的是1895年《马关条约》签订后，清政府将台湾割让给日本。诗中“往事”即指甲午中日战争中国的失败。" },
    { "id": 84, "type": "判断题", "text": "1935年1月，中共中央召开遵义会议。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "1935年1月，中共中央在贵州遵义召开政治局扩大会议（遵义会议），纠正了博古、李德等人的军事错误，确立了毛泽东的领导地位。" },
    { "id": 85, "type": "判断题", "text": "资本-帝国主义列强对中国的侵略，首先和主要的是进行文化渗透。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "资本—帝国主义列强对中国的侵略，首先和主要的是军事侵略（发动战争、强迫签约），而非文化渗透。文化渗透是辅助手段。" },
    { "id": 86, "type": "判断题", "text": "解放战争时期，中国共产党制定和通过了《中国土地法大纲》，明确规定“废除封建性及半封建性剥削的土地制度”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1947年，中国共产党制定和通过了《中国土地法大纲》，明确规定“废除封建性及半封建性剥削的土地制度，实行耕者有其田”。" },
    { "id": 87, "type": "判断题", "text": "解放战争时期中共领导的统一战线称为人民民主统一战线。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "解放战争时期，中国共产党领导的统一战线称为人民民主统一战线，它包括工人、农民、城市小资产阶级、民族资产阶级、开明绅士等一切反对国民党统治的力量。" },
    { "id": 88, "type": "判断题", "text": "全民族抗战以来中国军队主动寻歼敌人的第一次重大胜利，打破了日军不可战胜的神话的战役是淞沪会战。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "全民族抗战以来中国军队主动寻歼敌人的第一次重大胜利，打破了日军不可战胜神话的是平型关大捷（1937年9月），而非淞沪会战。淞沪会战是抗战初期规模最大的防御战役。" },
    { "id": 89, "type": "判断题", "text": "鸦片战争是中国近代史的开端。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1840年鸦片战争是中国近代史的开端，因为它标志着中国开始从封建社会沦为半殖民地半封建社会，中国社会性质发生根本变化。" },
    { "id": 90, "type": "判断题", "text": "1947年7月至9月，中国共产党在西柏坡召开全国土地会议，制定和通过了《天朝田亩制度》。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "1947年7—9月，中国共产党在西柏坡召开全国土地会议，制定和通过了《中国土地法大纲》，而非《天朝田亩制度》。《天朝田亩制度》是太平天国时期颁布的。" },
    { "id": 91, "type": "判断题", "text": "中国近代史的开端源于第二次鸦片战争。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "中国近代史的开端是第一次鸦片战争（1840年），而非第二次鸦片战争（1856—1860年）。" },
    { "id": 92, "type": "判断题", "text": "洋务运动兴办的近代企业包括军用工业和民用企业。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "洋务运动兴办的近代企业包括军用工业（如江南制造总局、福州船政局等）和民用企业（如轮船招商局、开平矿务局等）。" },
    { "id": 93, "type": "判断题", "text": "抗日战争胜利后，国民党坚持的方针是与中共坦诚合作。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "抗日战争胜利后，国民党坚持的方针是坚持独裁和内战的方针，而非与中共坦诚合作。国民党虽然在重庆谈判中签署了《双十协定》，但并无诚意，很快发动了全面内战。" },
    { "id": 94, "type": "判断题", "text": "南昌起义标志着中国人民抗日救亡运动新高潮到来。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "标志着中国人民抗日救亡运动新高潮到来的是一二·九运动（1935年12月9日），而非南昌起义。南昌起义（1927年）是武装反抗国民党反动派的开始，与抗日救亡运动高潮无直接关系。" },
    { "id": 95, "type": "判断题", "text": "魏源是睁眼看世界的第一人。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代中国“睁眼看世界的第一人”是林则徐，而非魏源。林则徐在鸦片战争期间组织编译《四洲志》，介绍世界情况。魏源是林则徐思想的继承者和发扬者。" },
    { "id": 96, "type": "判断题", "text": "1912年成立的南京临时政府是一个资产阶级共和国性质的革命政权。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1912年成立的南京临时政府，以孙中山为临时大总统，是资产阶级共和国性质的革命政权，代表了资产阶级民主革命的方向。" },
    { "id": 97, "type": "判断题", "text": "抗日根据地实行的土地政策是地主减租减息，农民交租交息。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "抗日战争时期，中国共产党在抗日根据地实行的土地政策是地主减租减息，农民交租交息，目的是团结各阶层一致抗日，既减轻农民负担，又照顾地主利益。" },
    { "id": 98, "type": "判断题", "text": "土地革命的胜利，是中国革命转危为安的关键。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "遵义会议的召开是中国革命转危为安的关键（而非土地革命的胜利）。土地革命是重要内容，但“转危为安的关键”特指遵义会议确立了毛泽东的正确领导。" },
    { "id": 99, "type": "判断题", "text": "1924年1月，中国国民党第一次全国代表大会在广州举行。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1924年1月，中国国民党第一次全国代表大会在广州召开，标志着第一次国共合作的正式形成。" },
    { "id": 100, "type": "判断题", "text": "《资政新篇》实际上是一个解决土地问题为中心的比较完整的社会改革方案。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "《资政新篇》是一个发展资本主义的社会改革方案，而非“以解决土地问题为中心”的方案。以解决土地问题为中心的是《天朝田亩制度》。《资政新篇》涉及政治、经济、文化、外交等多方面，并未把土地问题作为中心。" },
    { "id": 101, "type": "判断题", "text": "1949年，中国人民解放军占领南京，宣告国民党的反动统治覆灭。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1949年4月23日，人民解放军占领南京，宣告了国民党22年反动统治的覆灭。" },
    { "id": 102, "type": "判断题", "text": "中华人民共和国的成立，标志着中国进入了社会主义初级阶段。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "中华人民共和国的成立标志着中国进入了新民主主义社会，而非社会主义初级阶段。中国进入社会主义初级阶段是在1956年社会主义改造基本完成之后。" },
    { "id": 103, "type": "判断题", "text": "中国国民党一大确立了联俄、联共、扶助农工三大革命政策。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国国民党第一次全国代表大会确立了联俄、联共、扶助农工三大革命政策，这是新三民主义的核心内容。" },
    { "id": 104, "type": "判断题", "text": "1961年1月，党的八届九中全会决定对国民经济实行“调整、巩固、充实、提高”的八字方针（ ）", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1961年1月，中共八届九中全会正式决定对国民经济实行“调整、巩固、充实、提高”的八字方针，以纠正“大跃进”以来的经济困难。" },
    { "id": 105, "type": "判断题", "text": "1945年8月至10月，国共双方举行了确认和平建国基本方针的南京谈判。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1945年8—10月，国共双方在重庆举行谈判（重庆谈判），签署了《政府与中共代表会谈纪要》（即“双十协定”），确认了和平建国的基本方针。而非“南京谈判”。" },
    { "id": 106, "type": "判断题", "text": "1927年8月1日，毛泽东、叶剑英领导了南昌起义。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等领导了南昌起义，毛泽东并未参加南昌起义。毛泽东于同年9月领导了秋收起义。" },
    { "id": 107, "type": "判断题", "text": "新文化运动的基本口号是民主与科学。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "新文化运动（1915年开始）高举“民主”和“科学”两面大旗，反对封建专制和迷信愚昧，是一次伟大的思想解放运动。" },
    { "id": 108, "type": "判断题", "text": "以王明为代表的“左”倾教条主义错误继续坚持以城市为中心，要求红军攻打中心城市。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "以王明为代表的“左”倾教条主义错误，坚持“城市中心论”，要求红军攻打中心城市，导致第五次反“围剿”失败，红军被迫长征。" },
    { "id": 109, "type": "判断题", "text": "资本-帝国主义对中国的经济掠夺包括：控制中国的通商口岸、剥夺中国的关税自主权、实行商品倾销和资本输出、操纵中国的经济命脉。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资本—帝国主义对中国的经济掠夺包括：控制通商口岸、剥夺关税自主权、商品倾销和资本输出、操纵中国经济命脉（如铁路、矿山、银行等）。" },
    { "id": 110, "type": "判断题", "text": "1866年，左宗棠在福建创办的福州船政局，是当时最大的造船厂。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1866年，左宗棠在福建福州创办福州船政局，这是当时中国乃至远东地区最大的造船厂，专门制造和修理船舰。" },
    { "id": 111, "type": "判断题", "text": "《中华民国临时约法》以根本大法的形式废除了两千多年来的封建君主专制制度，确认了资产阶级共和国的政治制度。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1912年，南京临时政府颁布《中华民国临时约法》，以根本大法的形式废除了两千多年的封建君主专制制度，确认了资产阶级共和国的政治制度。" },
    { "id": 112, "type": "判断题", "text": "经历五四运动后，新文化运动提倡的“民主”主要指资产阶级民主。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "五四运动后，新文化运动提倡的“民主”已不再局限于资产阶级民主，而是开始指向社会主义民主和人民民主，因为马克思主义逐渐成为新文化运动的主流。" },
    { "id": 113, "type": "判断题", "text": "《天朝田亩制度》是最能体现太平天国社会理想和这次农民起义特色的纲领性文件。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《天朝田亩制度》是太平天国最重要的纲领性文件，集中体现了太平天国“有田同耕，有饭同食，有衣同穿，有钱同使”的社会理想和农民起义特色。" },
    { "id": 114, "type": "判断题", "text": "西安事变的和平解决，标志着抗日民族统一战线正式形成", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "西安事变的和平解决（1936年12月）标志着抗日民族统一战线的初步形成，而非正式形成。抗日民族统一战线正式形成的标志是1937年9月国民党公布《中国共产党为公布国共合作宣言》。" },
    { "id": 115, "type": "判断题", "text": "社会主义工业化是国家独立富强的重要条件", "options": ["A. 对", "B. 错"], "answer": 1, "category": "新中国建设与社会主义改造", "analysis": "社会主义工业化是巩固国家独立、实现富强的重要条件，但“首要条件”是政治独立和人民民主专政的建立。题干仅说“重要条件”而非“首要条件”，但本题判错（答案1），可能因命题者认为工业化并非关键条件，或因表述不够严谨。从历史角度看，国家独立富强的前提是政治独立，工业化是后续发展条件。" },
    { "id": 116, "type": "判断题", "text": "毛泽东在《论持久战》中指出，中国抗日战争取得胜利最关键的阶段是战略相持阶段。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "毛泽东在《论持久战》中指出，抗日战争要经过战略防御、战略相持、战略反攻三个阶段，其中战略相持阶段是取得胜利最关键的阶段，因为这是敌我力量转变的时期。" },
    { "id": 117, "type": "判断题", "text": "毛泽东在《反对本本主义》中，阐明了坚持辩证唯物主义思想路线的重要性，提出“没有调查，就没有发言权”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "毛泽东在1930年写的《反对本本主义》中，阐明了辩证唯物主义思想路线，明确提出“没有调查，就没有发言权”的著名论断，反对教条主义。" },
    { "id": 118, "type": "判断题", "text": "1936年12月12日爱国将领张学良、杨虎城发动西安事变。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1936年12月12日，张学良、杨虎城在西安发动兵谏（西安事变），扣留了蒋介石，要求停止内战、一致抗日。" },
    { "id": 119, "type": "判断题", "text": "人民政协的召开，标志着中国的新型政党制度——中国共产党领导的多党合作和政治协商制度的确立。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国人民政治协商会议的召开（1949年9月），标志着中国共产党领导的多党合作和政治协商制度的确立，这是中国的一项基本政治制度。" },
    { "id": 120, "type": "判断题", "text": "洋务派创办的新式学堂主要有三种：翻译学堂、工艺学堂、军事学堂。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "洋务派创办的新式学堂主要有三类：翻译学堂（如京师同文馆）、工艺学堂（如江南制造总局附设的工艺学堂）、军事学堂（如天津水师学堂）。" },
    { "id": 121, "type": "判断题", "text": "在八七会议中，毛泽东提出了“政权是由枪杆子中取得的”思想。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "在1927年的八七会议上，毛泽东提出了“政权是由枪杆子中取得的”著名论断，强调武装斗争的重要性。" },
    { "id": 122, "type": "判断题", "text": "中国人民抗日战争是20世纪中国和人类历史上的重大事件，这一伟大胜利，是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "中国人民抗日战争的胜利（1945年），是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点，也是世界反法西斯战争的重要组成部分。" },
    { "id": 123, "type": "判断题", "text": "1927年4月12日，蒋介石在上海发动反革命政变，在东南各省捕杀共产党员和革命群众。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1927年4月12日，蒋介石在上海发动“四一二”反革命政变，在东南各省捕杀共产党员和革命群众。但四一二政变属于第一次国共内战（土地革命战争）的开端，而非解放战争（1945—1949年）时期，类别归属不当，但史实本身正确。题干表述为事实，故判对（0）。" },
    { "id": 124, "type": "判断题", "text": "1924年至1927年中国反帝反封建的革命，比以往任何一次革命，包括辛亥革命和五四运动，群众的动员程度更广泛，斗争的规模更加宏伟，革命的社会内涵更为深刻。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1924—1927年的国民大革命，其规模、群众动员程度和社会内涵都超过了辛亥革命和五四运动，是中国近代史上一次广泛而深刻的革命运动。" },
    { "id": 125, "type": "判断题", "text": "土地革命战争期间，中国共产党党内开始滋长一种“左”的急躁情绪，先后出现三次“左”倾错误。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "土地革命战争期间，中国共产党内先后出现了三次“左”倾错误：第一次是瞿秋白的“左”倾盲动错误，第二次是李立三的“左”倾冒险错误，第三次是王明的“左”倾教条主义错误。" },
    { "id": 126, "type": "判断题", "text": "毛泽东总结中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设，是中国共产党在中国革命中战胜敌人的三个法宝。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "毛泽东在《〈共产党人〉发刊词》（1939年）中总结了中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个法宝。" },
    { "id": 127, "type": "判断题", "text": "1992年，邓小平巡视南方数个城市并发表重要讲话，强调发展才是硬道理。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "1992年1—2月，邓小平巡视武昌、深圳、珠海、上海等地并发表南方谈话，强调“发展才是硬道理”，明确了坚持改革开放的方向。" },
    { "id": 128, "type": "判断题", "text": "党的十九大明确，党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "党的十九大（2017年）明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。" },
    { "id": 129, "type": "判断题", "text": "土地革命战争时期的土地政策是地主减租减息，农民交租交息。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "“地主减租减息，农民交租交息”是抗日战争时期的土地政策，而非土地革命战争时期。土地革命战争时期（1927—1937年）的政策是没收地主土地分配给农民（“耕者有其田”）。" },
    { "id": 130, "type": "判断题", "text": "民族危机激发了中华民族的觉醒，增强了中华民族的凝聚力。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "民族危机（如鸦片战争、甲午战争、八国联军侵华等）激发了中华民族的觉醒，各阶层人民认识到民族存亡的紧迫性，增强了民族凝聚力。" },
    { "id": 131, "type": "判断题", "text": "全国性抗战开始后中国军队取得第一次重大胜利，粉碎了日军不可战胜的神话的战役是平型关大捷。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1937年9月的平型关大捷，是八路军出师以来的第一个大胜仗，也是全国性抗战开始后中国军队取得的第一次重大胜利，粉碎了日军不可战胜的神话。" },
    { "id": 132, "type": "判断题", "text": "遵义会议是中国共产党历史上一个生死攸关的转折点。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "遵义会议（1935年）挽救了党、挽救了红军、挽救了中国革命，是中国共产党历史上一个生死攸关的转折点，标志着中国共产党开始走向成熟。" },
    { "id": 133, "type": "判断题", "text": "1949 年 9 月召开的中国人民政治协商会议第一届全体会议通过了《和平建国纲领》。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "1949年9月召开的中国人民政治协商会议第一届全体会议通过了《共同纲领》（《中国人民政治协商会议共同纲领》），而非《和平建国纲领》。《和平建国纲领》是1946年政治协商会议通过的。" },
    { "id": 134, "type": "判断题", "text": "戊戌维新运动的宗旨是中体西用。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "戊戌维新运动的宗旨是变法维新、实行君主立宪，而“中体西用”是洋务运动的指导思想，两者不同。" },
    { "id": 135, "type": "判断题", "text": "太平天国领袖们笼统地把信奉天父上帝的西方人都视为“洋兄弟”，这说明他们对于西方资本主义侵略者还缺乏理性的认识。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国领袖把信仰上帝的外国人都视为“洋兄弟”，对西方资本主义侵略者缺乏理性认识，未能认清其侵略本质，这是太平天国失败的原因之一。" },
    { "id": 136, "type": "判断题", "text": "经历了五四运动以后，新文化运动进入到一个新阶段，马克思主义逐步在思想文化领域发挥主导作用了。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动以后，马克思主义在中国得到广泛传播，并在思想文化领域逐渐发挥主导作用，新文化运动进入以宣传马克思主义为主的新阶段。" },
    { "id": 137, "type": "判断题", "text": "1953年，中共中央正式提出党在过渡时期的总路线，即在相当长的时期内，逐步实现农业现代化，并逐步完成国家对交通运输业、服务业、社会主义工商业的社会主义改造。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "新中国建设与社会主义改造", "analysis": "1953年党在过渡时期的总路线是逐步实现国家的社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造，而非“农业现代化”和“交通运输业、服务业”的改造。" },
    { "id": 138, "type": "判断题", "text": "抗日战争开始后，在战略防御阶段，国民党军队组织了淞沪、忻口、徐州、武汉会战等一系列大战役。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "抗日战争战略防御阶段（1937年7月—1938年10月），国民党军队先后组织了淞沪会战、忻口会战、徐州会战、武汉会战等一系列大规模战役，阻击日军进攻。" },
    { "id": 139, "type": "判断题", "text": "在中共六届六中全会上，毛泽东明确提出了“马克思主义中国化”这个命题。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1938年，毛泽东在中共六届六中全会上作的《论新阶段》报告中，明确提出“马克思主义中国化”的命题，强调要将马克思主义与中国国情相结合。" },
    { "id": 140, "type": "判断题", "text": "辛亥革命彻底改变了中国社会的性质。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "辛亥革命推翻了两千多年的封建帝制，但没有改变中国半殖民地半封建社会的性质，中国社会性质真正改变是在1949年新中国成立之后。" },
    { "id": 141, "type": "判断题", "text": "维新变法期间，守旧派认为应当废除科举制度、大力提倡西学。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "维新变法期间，守旧派（顽固派）反对废除科举制度和提倡西学，他们坚持“祖宗之法不可变”，维护封建传统。主张废除科举、提倡西学的是维新派。" },
    { "id": 142, "type": "判断题", "text": "1911年4月，资产阶级革命派在黄兴带领下举行了黄花岗起义。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1911年4月27日，黄兴在广州领导了黄花岗起义，起义失败后牺牲的七十二烈士葬于黄花岗，史称“黄花岗七十二烈士”。" },
    { "id": 143, "type": "判断题", "text": "周恩来首先从理论上阐明了农村应当成为党的工作重心的思想。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "毛泽东首先从理论上阐明了农村应当成为党的工作重心的思想，他在《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》等文章中阐述了“农村包围城市”的道路。而非周恩来。" },
    { "id": 144, "type": "判断题", "text": "1945年底，昆明学生发动了以“反对内战，争取自由”为主要口号的五四运动。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "1945年底，昆明学生发动的是“一二·一运动”（以“反对内战，争取自由”为口号），而非五四运动。五四运动发生在1919年。" },
    { "id": 145, "type": "判断题", "text": "帝国主义和中华民族的矛盾，封建主义和人民大众的矛盾，这两对主要矛盾及其斗争贯穿整个中国半殖民地半封建社会的始终。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "近代中国半殖民地半封建社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，这两对矛盾贯穿整个半殖民地半封建社会的始终。" },
    { "id": 146, "type": "判断题", "text": "1927年大革命失败后的事实表明，中国革命的重心应当放在城市，到城市去发动工人，开展武装斗争。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "1927年大革命失败后，中国共产党认识到城市斗争的道路在中国行不通，毛泽东等领导人将革命重心转向农村，建立了农村革命根据地，开辟了农村包围城市的道路。" },
    { "id": 147, "type": "判断题", "text": "1937年夏，毛泽东在抗日军政大学讲授《实践论》《矛盾论》，深入论证马克思列宁主义基本原理同中国具体实际相结合的原则，科学阐明了党的马克思主义思想路线。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1937年夏，毛泽东在延安抗日军政大学讲授《实践论》和《矛盾论》，批判教条主义，论证马克思列宁主义与中国实际相结合的原则，阐明了党的马克思主义思想路线。" },
    { "id": 148, "type": "判断题", "text": "近代中国赔款最多的条约是《马关条约》。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代中国赔款最多的条约是《辛丑条约》（1901年），赔款4.5亿两白银，加上利息达9.8亿两。而《马关条约》赔款2亿两白银，不及《辛丑条约》。" },
    { "id": 149, "type": "判断题", "text": "《南京条约》规定，开放广州、厦门、福州、宁波、上海等5个港口城市为通商口岸。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1842年《南京条约》规定，开放广州、厦门、福州、宁波、上海五处为通商口岸，这是中国近代第一批被迫开放的口岸。" },
    { "id": 150, "type": "判断题", "text": "重庆谈判期间，国共双方通过谈判签署《政府与中共代表会谈纪要》，确认和平建国的基本方针。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "重庆谈判（1945年8—10月）期间，国共双方签署了《政府与中共代表会谈纪要》（“双十协定”），确认了和平建国的基本方针。" },
    { "id": 151, "type": "判断题", "text": "在五四运动中，工人阶级显示出了伟大的力量。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动中，中国工人阶级开始以独立的政治力量登上历史舞台，显示了伟大的力量，成为运动后期的主力军。" },
    { "id": 152, "type": "判断题", "text": "《资政新篇》是太平天国后期颁布的社会发展方案。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《资政新篇》是1859年洪仁玕提出的，是太平天国后期颁布的社会发展方案，主张学习西方，发展资本主义。" },
    { "id": 153, "type": "判断题", "text": "南京临时政府临时参议院颁布的《中华民国临时约法》，是中国历史上第一部具有资产阶级共和国宪法性质的法典。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1912年3月，南京临时政府颁布《中华民国临时约法》，这是中国历史上第一部具有资产阶级共和国宪法性质的法典。" },
    { "id": 154, "type": "判断题", "text": "三大战役的胜利标志着国民党军队的主力基本被消灭，人民解放战争在全国的胜利已成定局。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "辽沈、淮海、平津三大战役（1948年9月—1949年1月）消灭了国民党军队主力，人民解放战争在全国的胜利已成定局。" },
    { "id": 155, "type": "判断题", "text": "七届二中全会提出了 “两个务必” 的重要思想，即 “务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1949年3月，中共七届二中全会在西柏坡召开，毛泽东提出了“两个务必”的重要思想，要求全党在胜利面前保持清醒头脑。" },
    { "id": 156, "type": "判断题", "text": "在中国近代社会的两对主要矛盾中，帝国主义和中华民族的矛盾是最主要的矛盾。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "在近代中国两对主要矛盾中，帝国主义和中华民族的矛盾是最主要的矛盾，因为帝国主义侵略是造成中国贫穷落后的总根源。" },
    { "id": 157, "type": "判断题", "text": "1949年4月21日，毛泽东、朱德发布《向全国进军的命令》，人民解放军发动渡江战役，到23日，人民解放军占领南京，国民党反动统治覆灭。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1949年4月21日，毛泽东、朱德发布《向全国进军的命令》，人民解放军发起渡江战役，4月23日解放南京，宣告国民党反动统治覆灭。" },
    { "id": 158, "type": "判断题", "text": "抗日战争胜利后，国民党的反共方针得到了苏联的支持。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "抗日战争胜利后，国民党的反共方针得到了美国的支持（美国出钱出枪帮助国民党打内战），而非苏联。苏联支持的是中国共产党。" },
    { "id": 159, "type": "判断题", "text": "1895年，日本强迫清政府签订《马关条约》，割去中国台湾全岛及所有附属岛屿和澎湖列岛。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1895年《马关条约》规定，中国将台湾全岛及所有附属岛屿和澎湖列岛割让给日本，此后台湾被日本殖民统治长达50年。" },
    { "id": 160, "type": "判断题", "text": "维新派和守旧派论战，实质上是资产阶级思想和封建主义思想在中国的第一次正面交锋。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "维新派与守旧派的论战（19世纪末），实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋，为维新变法运动作了思想准备。" },
    { "id": 161, "type": "判断题", "text": "为造就革命武装的骨干力量，在共产党人建议下，国民党一大决定创办一所陆军军官学校——黄埔军校。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "在共产党人建议下，国民党一大决定创办黄埔陆军军官学校（1924年），以培养革命军事人才，蒋介石任校长，周恩来曾任政治部主任。" },
    { "id": 162, "type": "判断题", "text": "中日甲午战争后，中国人民的民族意识开始普遍觉醒。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "甲午战争（1894—1895年）后，中国战败，面临被列强瓜分的危机，中国人民的民族意识开始普遍觉醒，救亡图存成为时代主题。" },
    { "id": 163, "type": "判断题", "text": "《天朝田亩制度》是从政治、经济、文化和外交等方面提出来的资本主义社会发展方案。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "《天朝田亩制度》是以解决土地问题为中心的农民平均主义方案，而非从政治、经济、文化和外交等方面提出的资本主义社会发展方案。后者是《资政新篇》的特点。" },
    { "id": 164, "type": "判断题", "text": "资产阶级维新派试图通过光绪皇帝推行改革方案，却遭到了封建守旧势力的反对。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资产阶级维新派试图通过光绪皇帝推行变法（戊戌变法），但以慈禧太后为首的封建守旧势力发动政变，囚禁光绪，镇压维新派，导致变法失败。" },
    { "id": 165, "type": "判断题", "text": "中国人民抗日战争的胜利，促进了中华民族的大团结，形成了伟大的抗战精神。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "中国人民抗日战争的胜利促进了中华民族的空前团结，凝聚了以爱国主义为核心的伟大抗战精神，成为中华民族复兴的重要精神力量。" },
    { "id": 166, "type": "判断题", "text": "1898年6月11日，光绪颁布谕旨变法，在此后的103天接连颁布一系列新政的政令，又称“百日维新”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1898年6月11日，光绪皇帝颁布“明定国是”诏书，宣布变法，此后103天内接连颁布新政诏令，史称“百日维新”（戊戌变法）。" },
    { "id": 167, "type": "判断题", "text": "遵义会议是红军长征途中召开的。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "遵义会议（1935年1月）是在红军长征途中（贵州遵义）召开的，是长征途中最重要的一次会议。" },
    { "id": 168, "type": "判断题", "text": "1842年，中英签署了中国近代史上第一个不平等条约是《南京条约》。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1842年8月，中英签订《南京条约》，这是中国近代史上第一个不平等条约，标志着中国开始沦为半殖民地半封建社会。" },
    { "id": 169, "type": "判断题", "text": "中国近现代史以1949年新中国成立为界， 分为近代史和现代史。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "中国近现代史以1949年新中国成立为界，1840—1949年为近代史（半殖民地半封建社会），1949年至今为现代史（社会主义革命和建设时期）。" },
    { "id": 170, "type": "判断题", "text": "1924年国共合作的形成，加快了中国革命前进的步伐，1925年出现了全国范围的大革命高潮。掀起这一大革命高潮的起点是省港大罢工。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "掀起大革命高潮的起点是五卅运动（1925年5月30日），而非省港大罢工。省港大罢工是五卅运动的重要组成部分和延续，但起点是五卅运动。" },
    { "id": 171, "type": "判断题", "text": "辛亥革命比国民大革命斗争规模更加宏伟，群众的动员程度更为深刻。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "国民大革命（1924—1927年）的规模、群众动员程度比辛亥革命更广泛、更深刻，而非相反。大革命有更广泛的群众基础，包括工人、农民、学生等各阶层参与。" },
    { "id": 172, "type": "判断题", "text": "新文化运动中“民主”指封建主义的民主制度。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "新文化运动中“民主”指资产阶级民主（民主制度和民主思想），而非封建主义的民主制度（封建主义没有民主）。民主与封建专制是对立的。" },
    { "id": 173, "type": "判断题", "text": "洋务运动期间，所建成的水师海军主力是广东水师。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "洋务运动期间建成的主力海军是北洋水师（北洋海军），而非广东水师。北洋水师是当时中国最强大的海军舰队，在甲午战争中全军覆没。" },
    { "id": 174, "type": "判断题", "text": "经历了天京事变，太平天国领导人内部自相残杀，严重削弱了太平天国的领导力和军事力量。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "天京事变（1856年）中，太平天国领导人内部互相残杀，韦昌辉杀杨秀清，后被处死，石达开出走，严重削弱了太平天国的领导力量和军事力量。" },
    { "id": 175, "type": "判断题", "text": "近代以来中华民族第一次取得反侵略完全胜利的战争是抗美援朝战争。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代以来中华民族第一次取得反侵略完全胜利的战争是中国人民抗日战争（1945年），而非抗美援朝战争（1950—1953年）。抗美援朝是新中国成立后的对外战争。" },
    { "id": 176, "type": "判断题", "text": "五四运动的导火索是巴黎和会上中国外交的失败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动的直接导火索是1919年巴黎和会上中国外交的失败（将德国在山东的权益转让给日本），引发了中国人民的强烈愤慨。" },
    { "id": 177, "type": "判断题", "text": "红军先后取得了四次反“围剿”军事胜利,第五次反“围剿”作战失败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "红军先后取得了四次反“围剿”的胜利（1930—1933年），但在第五次反“围剿”（1933—1934年）中，由于博古、李德的错误指挥，红军作战失利，被迫长征。" },
    { "id": 178, "type": "判断题", "text": "中华苏维埃共和国实行工农兵代表大会制度。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "中华苏维埃共和国（1931—1937年）实行工农兵代表大会制度，各级苏维埃政府由工农兵代表大会选举产生，是中国共产党领导的工农民主政权。" },
    { "id": 179, "type": "判断题", "text": "1945年10月25日，中国政府在台湾举行受降仪式，被日本占领50年之久的台湾以及澎湖列岛，由中国收回。这成为抗日战争取得完全胜利的重要标志。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1945年10月25日，中国政府在台北举行受降仪式，正式接收台湾，被日本占领50年的台湾及澎湖列岛回归中国，这是抗日战争完全胜利的重要标志。" },
    { "id": 180, "type": "判断题", "text": "近代中国人民反侵略战争失败的根本原因是武器装备的落后。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代中国人民反侵略战争失败的根本原因是社会制度的腐败（封建专制制度的腐朽落后），而非武器装备的落后。武器装备落后是次要原因，根本原因在于制度。" },
    { "id": 181, "type": "判断题", "text": "义和团运动在19世纪中叶的亚洲民族解放运动中，是时间最久、规模最大、影响最深远的一次。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "在19世纪中叶的亚洲民族解放运动中，太平天国起义（1851—1864年）是时间最久、规模最大、影响最深远的一次，而非义和团运动（1899—1901年）。" },
    { "id": 182, "type": "判断题", "text": "中共一大正式宣告了中国共产党的成立。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1921年7月，中共一大在上海（最后一天移至嘉兴南湖）召开，正式宣告了中国共产党的成立，中国革命从此有了坚强的领导核心。" },
    { "id": 183, "type": "判断题", "text": "近代以来中华民族第一次取得反侵略完全胜利的战争是中国人民抗日战争。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1945年抗日战争的胜利，是近代以来中华民族第一次取得反侵略完全胜利的战争，改变了中国在国际上的地位。" },
    { "id": 184, "type": "判断题", "text": "1936年12月，毛泽东写了《中国革命战争的战略问题》，系统说明了有关中国革命战争战略方面的诸问题。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1936年12月，毛泽东写了《中国革命战争的战略问题》一书，系统总结土地革命战争的经验，全面阐述了中国革命战争的战略问题。" },
    { "id": 185, "type": "判断题", "text": "中国共产党领导的民主政权实行“三三制”原则是在抗日战争时期。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "抗日战争时期，中国共产党在抗日根据地实行“三三制”原则（共产党员、左派进步分子、中间分子各占三分之一），以巩固抗日民族统一战线。" },
    { "id": 186, "type": "判断题", "text": "在新三民主义中，民生主义被概括为平均地权和节制资本两大原则。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "在新三民主义中，民生主义被概括为“平均地权”和“节制资本”两大原则，前者解决土地问题，后者限制私人资本过度膨胀。" },
    { "id": 187, "type": "判断题", "text": "五卅运动标志着中国人民抗日救亡运动新高潮的到来", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "标志着中国人民抗日救亡运动新高潮到来的是一二·九运动（1935年），而非五卅运动（1925年）。五卅运动是反帝爱国运动，属于大革命时期。" },
    { "id": 188, "type": "判断题", "text": "中国工人阶级政党最早的组织，是在北京建立的。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "中国工人阶级政党最早的组织是在上海建立的（1920年8月，上海共产主义小组），而非北京。北京共产主义小组稍后成立（1920年10月）。" },
    { "id": 189, "type": "判断题", "text": "实践发展永无止境，解放思想永无止境，改革开放也永无止境。停顿和倒退没有出路，改革开放只有进行时、没有完成时。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "改革开放只有进行时、没有完成时，实践发展永无止境，解放思想永无止境，改革开放也永无止境。这是中共十八届三中全会提出的重要论断。" },
    { "id": 190, "type": "判断题", "text": "抗日战争时期，国民党实行的是全面抗战路线。（）", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "抗日战争时期，国民党实行的是片面抗战路线（只依靠政府和军队），而共产党实行的是全面抗战路线（动员全民族一切力量）。因此国民党不是“全面抗战路线”。" },
    { "id": 191, "type": "判断题", "text": "1931年9月18日，日本在中国制造了卢沟桥事变。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1931年9月18日，日本制造的是九一八事变（沈阳事变），而非卢沟桥事变（七七事变）。卢沟桥事变发生在1937年7月7日。" },
    { "id": 192, "type": "判断题", "text": "毛泽东同志把党的建设称之为中国共产党在中国革命中战胜敌人的三大法宝之一。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "毛泽东把党的建设同统一战线、武装斗争一起，称为中国共产党在中国革命中战胜敌人的三大法宝之一，强调党的建设对革命胜利的重要作用。" },
    { "id": 193, "type": "判断题", "text": "中国共产党第十九次全国代表大会确立了习近平新时代中国特色社会主义思想的历史地位。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党第十九次全国代表大会（2017年）确立习近平新时代中国特色社会主义思想为党的指导思想，实现了党的指导思想又一次与时俱进。" },
    { "id": 194, "type": "判断题", "text": "外部势力干涉是祖国统一的最大障碍，是民族复兴的严重隐患", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "祖国统一的最大障碍是“台独”分裂势力及其分裂活动，外部势力干涉是重要外部因素。“严重隐患”的表述在某些语境下使用，但本题可能因措辞被判断为不正确。从严谨的政治角度看，外部势力干涉是重要障碍，但“最大障碍”通常指向分裂势力。" },
    { "id": 195, "type": "判断题", "text": "人民代表大会制度这一新中国的根本政治制度的建立，始于中华人民共和国第一届全国人民代表大会第一次会议的召开。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "1954年第一届全国人民代表大会第一次会议的召开，标志着人民代表大会制度这一根本政治制度在全国范围内的正式建立。" },
    { "id": 196, "type": "判断题", "text": "中国共产党第一次全国代表大会在上海举行。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中共一大（1921年7月）在上海法租界望志路106号（今兴业路76号）开幕，后因遭法租界巡捕干扰，转移到浙江嘉兴南湖继续举行。" },
    { "id": 197, "type": "判断题", "text": "《天朝田亩制度》最终付诸实行", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "《天朝田亩制度》中的平分土地方案因战争环境和客观条件限制，并未真正付诸实行，只是一个理想化的纲领。" },
    { "id": 198, "type": "判断题", "text": "同盟会以《民报》为机关报。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "同盟会（1905年成立）以《民报》为机关报，孙中山在《民报》发刊词中首次提出了“三民主义”（民族、民权、民生）。" },
    { "id": 199, "type": "判断题", "text": "1927年7月15日，阎锡山在武汉发动反革命政变。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1927年7月15日，在武汉发动反革命政变的是汪精卫，而非阎锡山。阎锡山是山西军阀，没有在武汉发动反革命政变。" },
    { "id": 200, "type": "判断题", "text": "十月革命推动中国的先进分子从资产阶级民主主义转向无政府主义。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "十月革命推动中国的先进分子从资产阶级民主主义转向社会主义（马克思主义），而非无政府主义。无政府主义虽在当时也有传播，但不是十月革命推动的主要方向。" },
    { "id": 201, "type": "判断题", "text": "中国共产党的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。这是习近平总书记在党的十九大报告中明确提出的重要论断。" },
    { "id": 202, "type": "判断题", "text": "新文化运动在当时中国社会上掀起了一股思想解放潮流。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "新文化运动提倡民主与科学，反对封建专制和迷信愚昧，在中国社会掀起了一股思想解放的潮流，为五四运动作了思想准备。" },
    { "id": 203, "type": "判断题", "text": "1924年，国共两党共同创办黄埔陆军军官学校。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1924年，在苏联和中共帮助下，国共两党共同创办了黄埔陆军军官学校，蒋介石任校长，周恩来曾任政治部主任，培养了大批革命军事人才。" },
    { "id": 204, "type": "判断题", "text": "抗日战争时期，西南联大师生在战火中坚持办学的精神，今天仍值得我们学习和发扬。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "抗日战争时期，北京大学、清华大学、南开大学等迁至昆明组建西南联合大学，师生在战火中坚持办学，体现了中华民族不屈不挠的精神，值得今天学习和发扬。" },
    { "id": 205, "type": "判断题", "text": "资本-帝国主义列强对中国的侵略，客观上为中国资本主义发展创造了有利的条件。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资本—帝国主义列强的侵略，在客观上破坏了中国的自然经济，为中国资本主义的发展创造了一定的客观条件（如商品市场、劳动力市场等），但这是以中国沦为半殖民地为代价的。" },
    { "id": 206, "type": "判断题", "text": "1927年七一五反革命政变的发生标志着国共关系全面破裂，大革命彻底失败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1927年7月15日，汪精卫在武汉发动“七一五”反革命政变，正式分共，标志着国共关系全面破裂，轰轰烈烈的大革命彻底失败。" },
    { "id": 207, "type": "判断题", "text": "《临时约法》以根本大法的形式废除了两千多年来的封建君主专制制度，确认了资产阶级共和国的政治制度。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《中华民国临时约法》以根本大法的形式宣告了封建君主专制制度的终结，确立了资产阶级共和国的政治制度，是中国近代民主政治的重要里程碑。" },
    { "id": 208, "type": "判断题", "text": "20世纪30年代前中期，中国共产党内屡次出现“左”倾错误，其主要原因在于不善于将马克思列宁主义的理论与中国革命的实际正确的结合起来。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "20世纪30年代前中期，中国共产党内出现三次“左”倾错误，根本原因在于中国共产党还处于幼年时期，不善于将马克思列宁主义理论与中国革命实际正确结合。" },
    { "id": 209, "type": "判断题", "text": "孙中山在檀香山组建了第一个革命团体同盟会。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "孙中山在檀香山组建的第一个革命团体是兴中会（1894年），而非同盟会。同盟会是在兴中会、华兴会、光复会等团体基础上于1905年在东京成立的。" },
    { "id": 210, "type": "判断题", "text": "谭嗣同、刘光弟、林旭、杨锐、杨深秀、康广仁6人于1898年9月28日被杀害，史称“戊戌六君子”。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1898年戊戌变法失败后，谭嗣同、刘光弟、林旭、杨锐、杨深秀、康广仁六人被杀害，史称“戊戌六君子”。（注意：刘光弟实为“刘光第”）" },
    { "id": 211, "type": "判断题", "text": "1978年进行的关于真理标准问题大讨论，是一场马克思主义思想解放运动，它强调实践是检验真理的唯一标准。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "1978年开展的真理标准问题大讨论，是一场马克思主义思想解放运动，它冲破了“两个凡是”的思想束缚，强调实践是检验真理的唯一标准，为十一届三中全会作了思想准备。" },
    { "id": 212, "type": "判断题", "text": "五四运动发生于1919年。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动爆发于1919年5月4日，是一场彻底的反帝反封建的伟大爱国革命运动。" },
    { "id": 213, "type": "判断题", "text": "太平天国起义是中国旧式农民战争最高峰。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国起义（1851—1864年）是中国旧式农民战争的最高峰，其规模之大、影响之广、持续时间之长都超过了历史上的任何一次农民起义。" },
    { "id": 214, "type": "判断题", "text": "北伐战争的讨伐对象为吴佩孚、张作霖、孙传芳。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "北伐战争（1926—1927年）的讨伐对象是吴佩孚、孙传芳、张作霖三大北洋军阀，旨在打倒军阀，统一全国。" },
    { "id": 215, "type": "判断题", "text": "人民解放军战略决战的三大战役，开始最早的是淮海战役。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "人民解放军战略决战的三大战役中，开始最早的是辽沈战役（1948年9月12日），而非淮海战役（1948年11月6日开始）。淮海战役是第二个。" },
    { "id": 216, "type": "判断题", "text": "1851年，洪秀全率拜上帝教在广西桂平金田村发动起义，建号太平天国。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1851年1月11日，洪秀全在广西桂平县金田村发动起义，建号“太平天国”，揭开了太平天国运动的序幕。" },
    { "id": 217, "type": "判断题", "text": "近代中国社会的主要矛盾是地主阶级与农民阶级的矛盾。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，而非地主阶级与农民阶级的矛盾（这是封建社会的主要矛盾）。" },
    { "id": 218, "type": "判断题", "text": "能不能保卫住人民胜利的成果，巩固新生的人民政权，是新中国成立之初中国共产党面临的新的严峻考验之一。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "新中国成立之初，中国共产党面临能否保卫革命成果、巩固新生人民政权、恢复国民经济等严峻考验，中国共产党领导人民成功应对了这些挑战。" },
    { "id": 219, "type": "判断题", "text": "党的十八大以来，以习近平同志为核心的党中央从理论和实践结合上系统回答了新时代坚持和发展什么样的中国特色社会主义、怎么样坚持和发展中国特色社会主义这个重大时代课题。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "党的十八大以来，以习近平同志为核心的党中央系统回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题，形成了习近平新时代中国特色社会主义思想。" },
    { "id": 220, "type": "判断题", "text": "天京事变成为太平天国由盛转衰的分水岭。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "天京事变（1856年）是太平天国领导集团内部的一次大分裂，标志着太平天国由盛转衰的分水岭。" },
    { "id": 221, "type": "判断题", "text": "历史经验表明，资产阶级共和国方案在中国行不通。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "历史经验证明，在中国半殖民地半封建社会的条件下，资产阶级共和国方案行不通。中国只能走社会主义道路，这是历史和人民的选择。" },
    { "id": 222, "type": "判断题", "text": "国民党一大的召开标志着第一次国共合作的正式形成。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国国民党第一次全国代表大会（1924年）的召开，标志着第一次国共合作的正式形成，国共合作推动了大革命的兴起。" },
    { "id": 223, "type": "判断题", "text": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和落后的社会生产之间的矛盾。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "改革开放与新时代", "analysis": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，而非“落后的社会生产”之间的矛盾。“落后的社会生产”是旧矛盾的表述（中共八大时的提法）。" },
    { "id": 224, "type": "判断题", "text": "资产阶级维新派在宣传中，把重点放在争取光绪皇帝及其周围的帝党官员的支持上。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资产阶级维新派在宣传变法时，重点争取光绪皇帝及其周围的帝党官员的支持，希望通过自上而下的改革实现变法，这是其策略局限性的表现。" },
    { "id": 225, "type": "判断题", "text": "以王明为代表的“左”倾教条主义错误使中国革命遭受严重挫折。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "以王明为代表的“左”倾教条主义错误，导致了第五次反“围剿”失败和红军被迫长征，使中国革命遭受了严重挫折。" },
    { "id": 226, "type": "判断题", "text": "红军第五次反“围剿”失利后，被迫进行长征。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "红军第五次反“围剿”失利（1934年）后，中央红军被迫实行战略性转移，开始长征，以保存革命力量。" },
    { "id": 227, "type": "判断题", "text": "抗日根据地建设的首要的、根本的任务是加强政权建设。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "抗日根据地建设的首要的、根本的任务是加强政权建设，通过“三三制”原则建立民主政权，团结各阶层抗日力量。" },
    { "id": 228, "type": "判断题", "text": "中国人民抗日战争的胜利，对世界各国夺取反法西斯战争的胜利产生了巨大影响。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "中国抗日战争的胜利是世界反法西斯战争的重要组成部分，中国人民的抗战对世界各国取得反法西斯战争的胜利产生了重大影响，中国也因此成为联合国安理会常任理事国之一。" },
    { "id": 229, "type": "判断题", "text": "兴中会是近代中国第一个领导资产阶级革命的全国性政党。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "近代中国第一个领导资产阶级革命的全国性政党是中国同盟会（1905年），而非兴中会。兴中会（1894年）是中国第一个资产阶级革命团体，但不是全国性政党。" },
    { "id": 230, "type": "判断题", "text": "将毛泽东思想规定为党的工作的指导思想是在中共六大。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "将毛泽东思想规定为党的工作的指导思想是在中共七大（1945年），而非中共六大（1928年）。中共六大在莫斯科召开，当时尚未确立毛泽东思想。" },
    { "id": 231, "type": "判断题", "text": "“一五”期间，在苏联的援助下，中国着重建设了一大批基础性的重点工程，为国家的工业化奠定了初步的坚实基础。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "“一五”计划（1953—1957年）期间，在苏联援助下，中国建设了156个重点工程项目，为国家工业化奠定了初步基础。" },
    { "id": 232, "type": "判断题", "text": "对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "对个体农业进行社会主义改造，将分散的个体农业改造为集体农业，是保证工业发展、实现国家工业化的必要条件，也是巩固工农联盟的需要。" },
    { "id": 233, "type": "判断题", "text": "南昌起义在最危急关头挽救了党、挽救了红军、挽救了中国革命。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "在最危急关头挽救了党、挽救了红军、挽救了中国革命的是遵义会议（1935年），而非南昌起义。南昌起义（1927年）是武装反抗国民党统治的开始，但之后革命遭到严重挫折，遵义会议才是转危为安的关键。" },
    { "id": 234, "type": "判断题", "text": "国民党之所以迅速失去民心，主要是由于它违背全国人民迫切要求休养生息、和平建国的意愿，执行反人民的内战政策。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "国民党在抗日战争胜利后违背全国人民和平建国的愿望，发动反人民的内战，因而迅速失去民心，这是其失败的根本原因之一。" },
    { "id": 235, "type": "判断题", "text": "资产阶级革命派主张实行君主立宪制，改良派主张实行民主共和制。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "资产阶级革命派主张实行民主共和制，而改良派（维新派）主张实行君主立宪制。题干正好说反了。" },
    { "id": 236, "type": "判断题", "text": "资本-帝国主义列强对中国进行的文化侵略，其目的是宣扬殖民主义奴化思想，麻醉中国人民的精神，摧毁中国人的民族自尊心和自信心。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资本—帝国主义列强通过传教、办学校、办报纸等进行文化渗透，目的是宣扬殖民主义奴化思想，麻醉中国人民精神，摧毁民族自尊心和自信心。" },
    { "id": 237, "type": "判断题", "text": "1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗，反侵略战争的失败原因有两个方面：一是社会制度的腐败，一是经济技术的落后。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1840—1919年反侵略战争失败的原因：社会制度的腐败是根本原因，经济技术的落后是重要原因。两者共同导致了反侵略斗争的失败。" },
    { "id": 238, "type": "判断题", "text": "中华苏维埃共和国是中国历史上第一个全国性的工农民主政权。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "中华苏维埃共和国（1931年成立于江西瑞金）是中国历史上第一个全国性的工农民主政权，是中国共产党领导的人民政权的重要尝试。" },
    { "id": 239, "type": "判断题", "text": "太平天国起义沉重打击了清王朝的封建统治。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国起义历时14年，席卷大半个中国，沉重打击了清王朝的封建统治，动摇了其统治基础，具有重要的历史意义。" },
    { "id": 240, "type": "判断题", "text": "南昌起义打响了武装反抗国民党反动统治的第一枪。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "1927年8月1日，南昌起义打响了武装反抗国民党反动统治的第一枪，标志着中国共产党独立领导革命战争、创建人民军队的开始。" },
    { "id": 241, "type": "判断题", "text": "戊戌维新运动使中国走上了资本主义发展道路。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "戊戌维新运动最终失败了，没有使中国走上资本主义发展道路。中国半殖民地半封建社会的性质没有改变，说明资产阶级改良道路在中国行不通。" },
    { "id": 242, "type": "判断题", "text": "1935年日本帝国主义制造了侵略中国的华北事变。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "1935年，日本帝国主义制造了华北事变（包括《秦土协定》《何梅协定》等），加强对华北地区的控制，民族危机进一步加深。" },
    { "id": 243, "type": "判断题", "text": "邓小平的南方谈话，在重大历史关头科学地总结了十一届三中全会以来党的基本实践和基本经验，明确回答了长期困扰和束缚人们思想的许多重大认识问题，对整个社会主义现代化建设事业产生了重大影响。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "邓小平1992年南方谈话，总结了十一届三中全会以来的基本经验，回答了长期困扰人们思想的许多重大认识问题，推动了改革开放和现代化建设事业。" },
    { "id": 244, "type": "判断题", "text": "在土地革命战争期间，中心城市已经成为中国革命的主要战略阵地。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "在土地革命战争时期，农村才是中国革命的主要战略阵地（农村革命根据地），而非中心城市。“城市中心论”是错误的，是导致第五次反“围剿”失败的重要原因。" },
    { "id": 245, "type": "判断题", "text": "西方传教士在中国的活动，完全是为了传播先进文化和科学知识。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "西方传教士在中国的活动，表面上是传播宗教和文化，但本质上是为西方殖民扩张服务的，是文化侵略的重要方式，并非“完全为了传播先进文化和科学知识”。" },
    { "id": 246, "type": "判断题", "text": "鸦片战争后，中国自然经济迅速瓦解，资本主义经济成为主导。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "鸦片战争后，中国自然经济开始解体，但资本主义经济并未成为主导。中国社会经济中占主导地位的仍然是封建自然经济，资本主义经济比重很小。" },
    { "id": 247, "type": "判断题", "text": "1935年12月，毛泽东作了《论反对日本帝国主义的策略》的报告，系统说明了党在政治策略上的诸问题。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "1935年12月，毛泽东在瓦窑堡会议上作了《论反对日本帝国主义的策略》的报告，系统阐述了抗日民族统一战线策略问题。" },
    { "id": 248, "type": "判断题", "text": "在五四运动以前，新文化运动很多领导人已经具备了马克思主义的批判精神。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "在五四运动以前，新文化运动的领导人（如陈独秀、胡适等）主要提倡民主与科学，但他们的思想基础是资产阶级民主主义，尚未具备马克思主义的批判精神。五四运动后，马克思主义才开始广泛传播。" },
    { "id": 249, "type": "判断题", "text": "1946年6月26日，国民党军队挑起全国性内战的起点是大举进攻中原解放区。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1946年6月26日，国民党军队以30万兵力大举进攻中原解放区，全面内战爆发，这是全面内战的起点。" },
    { "id": 250, "type": "判断题", "text": "社会主义工业化是国家独立富强的首要条件", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "社会主义工业化是国家独立富强的首要条件（或“重要条件”），只有实现工业化，才能改变国家贫穷落后的面貌，巩固人民民主专政。" },
    { "id": 251, "type": "判断题", "text": "《资政新篇》是一个具有资本主义色彩的方案。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《资政新篇》主张学习西方资本主义国家的政治、经济、文化制度，发展资本主义工商业，是一个具有资本主义色彩的治国方案。" },
    { "id": 252, "type": "判断题", "text": "中国近代史上第一个不平等条约是《南京条约》。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "中国近代史上第一个不平等条约是1842年的《南京条约》，标志着中国开始沦为半殖民地半封建社会。" },
    { "id": 253, "type": "判断题", "text": "太平天国运动是地主阶级领导的", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "太平天国运动是农民阶级领导的，而非地主阶级领导的。洪秀全等领导人出身农民或下层社会，代表农民利益。" },
    { "id": 254, "type": "判断题", "text": "意大利是最早为中国抗日战争提供援助的国家。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "最早为中国抗日战争提供援助的国家是苏联（1937年8月《中苏互不侵犯条约》签订后，苏联提供物资援助和空军志愿队），而非意大利。意大利是法西斯轴心国之一，与日本同盟。" },
    { "id": 255, "type": "判断题", "text": "帝国主义侵略中国的最终目的是要瓜分中国、灭亡中国。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "帝国主义侵略中国的最终目的是要把中国变为其殖民地，瓜分中国、灭亡中国是列强的根本目标，尽管由于中国人民反抗和列强矛盾未能完全实现。" },
    { "id": 256, "type": "判断题", "text": "资本-帝国主义对中国的侵略包括：军事侵略、政治控制、经济掠夺、文化渗透。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "资本—帝国主义对中国的侵略方式包括军事侵略、政治控制、经济掠夺、文化渗透四个方面，从不同角度对中国进行全方位侵略。" },
    { "id": 257, "type": "判断题", "text": "1978年12月，党的十一届三中全会在北京召开，此次会议作为一个伟大的转折点而载入光辉史册。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "改革开放与新时代", "analysis": "1978年12月召开的党的十一届三中全会，是新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设的新时期。" },
    { "id": 258, "type": "判断题", "text": "1895年《马关条约》签订后，日本强迫清政府将辽东半岛割让给它。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1895年《马关条约》签订后，俄国、德国、法国三国干涉还辽，迫使日本将辽东半岛归还中国（清政府支付赎金3000万两），日本并未实际割占辽东半岛。" },
    { "id": 259, "type": "判断题", "text": "戊戌维新运动依靠了广泛的人民群众参与。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "戊戌维新运动没有依靠人民群众，而是依靠光绪皇帝和少数维新派人士，缺乏广泛的群众基础，这是其失败的重要原因之一。" },
    { "id": 260, "type": "判断题", "text": "在解放战争胜利发展的同时，解放区开展了土地改革运动。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "解放战争时期，解放区开展了轰轰烈烈的土地改革运动（特别是1947年《中国土地法大纲》颁布后），极大地调动了广大农民的积极性。" },
    { "id": 261, "type": "判断题", "text": "太平天国运动农民起义成功了", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "太平天国运动最终失败了（1864年天京陷落），并未成功。农民阶级的局限性导致其无法取得最终胜利。" },
    { "id": 262, "type": "判断题", "text": "五四运动后期，运动中心从北京转移至上海。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动前期（5月4日—6月初）中心在北京，以学生为主力；后期（6月3日以后）中心转移到上海，工人阶级成为运动主力，形成了“三罢”斗争。" },
    { "id": 263, "type": "判断题", "text": "三元里人民的抗英斗争，是中国近代史上中国人民第一次大规模的反侵略武装斗争。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "1841年5月，广东三元里人民自发组织抗英斗争，这是中国近代史上中国人民第一次大规模的反侵略武装斗争。" },
    { "id": 264, "type": "判断题", "text": "在艰苦卓绝的十四年抗日战争中，以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素，中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "抗日战争胜利的关键在于以爱国主义为核心的民族精神提供了强大精神动力，而中国共产党的中流砥柱作用是取得胜利的关键。" },
    { "id": 265, "type": "判断题", "text": "八七会议彻底清算了以王明为代表的“左”倾冒险主义错误。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "八七会议（1927年）总结了陈独秀右倾机会主义错误，但并未彻底清算以王明为代表的“左”倾冒险主义错误。王明“左”倾错误是在遵义会议（1935年）和延安整风运动中才得到系统纠正的。" },
    { "id": 266, "type": "判断题", "text": "中国共产党通过开展土地革命，充分调动了广大农民发展生产和参军的积极性，促进了革命形势的向前发展。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "土地革命战争时期，中国共产党通过开展土地革命，没收地主土地分给农民，极大地调动了广大农民发展生产、参军参战的积极性，促进了革命形势的发展。" },
    { "id": 267, "type": "判断题", "text": "1946年6月全面内战爆发时，国民党军队首先进攻的地区是山东解放区。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "1946年6月全面内战爆发时，国民党军队首先进攻的是中原解放区（湖北宣化店地区），而非山东解放区。山东解放区是重点进攻的对象（1947年），但不是首先进攻的地区。" },
    { "id": 268, "type": "判断题", "text": "1937年8月，中国共产党在陕北洛川召开政治局扩大会议，制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族的抗战。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "1937年8月，中共中央在陕北洛川召开洛川会议，制定了《抗日救国十大纲领》，强调必须实行全面全民族的抗战路线，反对国民党片面抗战路线。" },
    { "id": 269, "type": "判断题", "text": "在三大战役后，国民党赖以维持其反动统治的主要军事力量基本上被摧毁。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "三大战役（1948—1949年）后，国民党军队的主力基本上被消灭，国民党赖以维持反动统治的主要军事力量被摧毁。" },
    { "id": 270, "type": "判断题", "text": "“九一八事变”标志着日本变中国为其独占殖民地的阶段的开始。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "“九一八事变”（1931年）后，日本占领东北，标志着日本帝国主义开始变中国为其独占殖民地的阶段，中日民族矛盾逐步上升为主要矛盾。" },
    { "id": 271, "type": "判断题", "text": "1901年，清政府与西方列强八国联军签订《辛丑条约》。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1901年，清政府与英、美、日、俄、法、德、意、奥、西、荷、比等11国签订《辛丑条约》（共11国），而非仅与“八国联军”签订。题中“与西方列强八国联军”表述不准确。" },
    { "id": 272, "type": "判断题", "text": "武昌起义打响了武装反抗国民党反动派的第一枪。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "解放战争", "analysis": "打响了武装反抗国民党反动派第一枪的是南昌起义（1927年8月1日），而非武昌起义（1911年10月10日）。武昌起义是辛亥革命推翻清王朝的起义。" },
    { "id": 273, "type": "判断题", "text": "揭开人民解放战争战略进攻序幕的是晋冀鲁豫野战军千里跃进大别山。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "解放战争", "analysis": "1947年6月，刘伯承、邓小平率晋冀鲁豫野战军主力千里跃进大别山，揭开了解放战争战略进攻的序幕。" },
    { "id": 274, "type": "判断题", "text": "严复《救亡决论》一文，响亮地喊出了“救亡”的口号。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "严复在1895年写的《救亡决论》中，响亮地喊出了“救亡”的口号，呼吁国人奋起救国，体现了强烈的民族危机意识。" },
    { "id": 275, "type": "判断题", "text": "领导国民经济恢复工作，是新中国成立初期中国共产党和人民政府着重所抓的工作之一。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "新中国成立初期，中国共产党和人民政府着重抓了领导国民经济恢复工作，经过三年努力（1950—1952年），国民经济得到全面恢复和发展。" },
    { "id": 276, "type": "判断题", "text": "1934年10月中旬，中央红军开始长征。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "1934年10月中旬，中央红军从江西瑞金等地出发，开始了举世闻名的二万五千里长征。" },
    { "id": 277, "type": "判断题", "text": "洋务派经营多年的北洋海军全军覆没，标志着洋务运动的失败。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "在1894—1895年的甲午战争中，洋务派经营多年的北洋海军（北洋水师）全军覆没，标志着洋务运动的彻底失败。" },
    { "id": 278, "type": "判断题", "text": "1931年11月，中华苏维埃第一次工农兵全国代表大会在江西瑞金举行。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "1931年11月，中华苏维埃第一次全国工农兵代表大会在江西瑞金召开，宣布中华苏维埃共和国临时中央政府成立。" },
    { "id": 279, "type": "判断题", "text": "资本-帝国主义列强对中国的侵略，首先和主要的是进行政治控制。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "资本—帝国主义列强对中国的侵略，首先和主要的是军事侵略（通过战争打开中国大门），而非政治控制。政治控制是军事侵略后的后续手段。" },
    { "id": 280, "type": "判断题", "text": "同盟会纲领中的民族主义没有从正面鲜明地提出反对帝国主义的主张。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "同盟会纲领中的民族主义（“驱除鞑虏，恢复中华”）主要是反对满清统治，没有从正面鲜明地提出反对帝国主义的主张，这是其局限性之一。" },
    { "id": 281, "type": "判断题", "text": "秋收起义打响了武装反抗国民党反动派的第一枪。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "土地革命与武装斗争", "analysis": "打响武装反抗国民党反动派第一枪的是南昌起义（1927年8月1日），而非秋收起义（1927年9月9日）。秋收起义是继南昌起义后的又一次重要武装起义。" },
    { "id": 282, "type": "判断题", "text": "从1953年开始发展国民经济第一个五年计划。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "1953年，中国开始实施发展国民经济第一个五年计划（1953—1957年），这是新中国工业化建设的开端。" },
    { "id": 283, "type": "判断题", "text": "秋收起义后，毛泽东率领起义军公开打出了工农革命军的旗号。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "土地革命与武装斗争", "analysis": "秋收起义（1927年9月）中，毛泽东率领起义军公开打出了“工农革命军”的旗号，这是中国共产党第一次公开打出自己的旗帜。" },
    { "id": 284, "type": "判断题", "text": "1937年秋，中国共产党领导的人民解放战争进入夺取全国胜利的决定性阶段。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党领导的人民解放战争进入夺取全国胜利的决定性阶段是在1948年秋至1949年初（三大战役时期），而非1937年秋。1937年秋是抗日战争初期。" },
    { "id": 285, "type": "判断题", "text": "太平天国起义的失败表明，农民阶级自身不能担负起领导反帝反封建斗争取得胜利的重任。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "太平天国起义的失败表明，农民阶级由于缺乏科学的指导思想、先进的组织形式和阶级局限性，不能担负起领导反帝反封建斗争取得胜利的重任。" },
    { "id": 286, "type": "判断题", "text": "《马关条约》签订后，日本就开始了在台湾长达50年的殖民统治。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "《马关条约》（1895年）将台湾及澎湖列岛割让给日本，此后日本在台湾开始了长达50年（1895—1945年）的殖民统治。" },
    { "id": 287, "type": "判断题", "text": "中国共产党采用群众路线的方法去开展革命。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "中国共产党的成立与早期革命", "analysis": "中国共产党在革命斗争中始终坚持群众路线（一切为了群众，一切依靠群众，从群众中来，到群众中去），这是党取得胜利的重要法宝。" },
    { "id": 288, "type": "判断题", "text": "抗日战争胜利后，国民党集团的根本目标是使战后的中国维持蒋介石的独裁统治，继续走半殖民地半封建社会的老路。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "抗日战争", "analysis": "抗日战争胜利后，国民党集团的根本目标仍然是维护蒋介石的独裁统治，继续走半殖民地半封建社会的老路，这与全国人民和平民主的要求相违背。" },
    { "id": 289, "type": "判断题", "text": "1935年12月，中国共产党确定抗日民族统一战线政策的会议是洛川会议。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "中国共产党的成立与早期革命", "analysis": "确定抗日民族统一战线政策的会议是瓦窑堡会议（1935年12月），而非洛川会议（1937年8月）。洛川会议是制定抗日救国十大纲领，瓦窑堡会议是确定建立抗日民族统一战线的方针。" },
    { "id": 290, "type": "判断题", "text": "五四运动期间，迫于人民群众的压力，北洋政府被迫罢免曹汝霖、章宗祥、陆宗舆的职务。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "五四运动与新文化运动", "analysis": "五四运动期间，北洋政府迫于人民群众的巨大压力，罢免了曹汝霖、章宗祥、陆宗舆三个亲日派官僚的职务。" },
    { "id": 291, "type": "判断题", "text": "中共七大，毛泽东同志提出了著名的“两个务必”的思想。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "提出“两个务必”思想的是毛泽东在七届二中全会（1949年3月）上，而非中共七大（1945年）。中共七大确立毛泽东思想为党的指导思想。" },
    { "id": 292, "type": "判断题", "text": "新文化运动兴起的标志是鲁迅发表《狂人日记》。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "五四运动与新文化运动", "analysis": "新文化运动兴起的标志是1915年陈独秀创办《青年杂志》（后改名《新青年》），而非鲁迅发表《狂人日记》（1918年）。《狂人日记》是新文化运动时期的重要文学作品，但不是运动开始的标志。" },
    { "id": 293, "type": "判断题", "text": "1956年，社会主义改造的基本完成，标志着中国进入全面建设社会主义社会的历史阶段。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "新中国建设与社会主义改造", "analysis": "1956年，社会主义改造基本完成，标志着中国进入全面建设社会主义社会的历史阶段，社会主义制度在中国基本建立起来。" },
    { "id": 294, "type": "判断题", "text": "战略反攻阶段是抗日战争最关键阶段", "options": ["A. 对", "B. 错"], "answer": 1, "category": "抗日战争", "analysis": "抗日战争最关键的阶段是战略相持阶段（毛泽东《论持久战》中明确指出），而非战略反攻阶段。相持阶段是敌我力量转变的关键时期。" },
    { "id": 295, "type": "判断题", "text": "辛亥革命使民主共和观念深入人心。", "options": ["A. 对", "B. 错"], "answer": 0, "category": "其他", "analysis": "辛亥革命推翻了清王朝和封建帝制，建立了中华民国，使民主共和观念深入人心，此后任何复辟帝制的企图都不能成功。" },
    { "id": 296, "type": "判断题", "text": "1853年，太平军占领广州，将其定为首都，改名为天京，正式宣告太平天国农民政权的建立。", "options": ["A. 对", "B. 错"], "answer": 1, "category": "其他", "analysis": "1853年，太平军占领的是南京（改名为天京），而非广州。广州是清政府控制的重要城市，太平天国定都天京（南京），以此为中心建立政权。" },

        let currentFilter = 'all';
        let answeredMap = new Map();

        function getFilteredQuestions() {
            if (currentFilter === 'all') return allQuestions;
            return allQuestions.filter(q => q.category === currentFilter);
        }

        function render() {
            const filtered = getFilteredQuestions();
            const container = document.getElementById('questionList');
            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#64748b;">暂无此分类题目</div>`;
                updateStats();
                return;
            }

            let html = '';
            filtered.forEach(q => {
                const state = answeredMap.get(q.id);
                const selected = state ? state.selected : null;
                const isCorrect = state ? state.correct : null;
                const labels = ['A','B','C','D'];

                html += `<div class="question-card">`;
                html += `<div class="q-header"><span class="q-number">#${q.id}</span><span class="q-tag">${q.category}</span><span style="font-size:13px;color:#64748b;">${q.type}</span></div>`;
                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options">`;

                q.options.forEach((opt, i) => {
                    let cls = 'option-item';
                    if (selected !== null) {
                        if (i === q.answer) cls += ' show-correct';
                        if (i === selected) cls += isCorrect ? ' selected-correct' : ' selected-wrong';
                    }
                    html += `<div class="${cls}" data-qid="${q.id}" data-idx="${i}">${labels[i]}. ${opt.slice(2).trim()}</div>`;
                });
                html += `</div>`;

                if (selected !== null) {
                    const fbClass = isCorrect ? 'correct' : 'wrong';
                    html += `<div class="feedback ${fbClass}">
                        ${isCorrect ? '✅ 正确！' : '❌ 错误'}
                        <span style="display:block;margin-top:8px;font-weight:600;">正确答案：${labels[q.answer]}. ${q.options[q.answer].slice(2).trim()}</span>
                    </div>`;
                    html += `<div class="analysis"><strong>📝 解析：</strong>${q.analysis}</div>`;
                }
                html += `</div>`;
            });

            container.innerHTML = html;
            updateStats();

            // 点击事件
            document.querySelectorAll('.option-item').forEach(el => {
                el.addEventListener('click', () => {
                    const qid = parseInt(el.dataset.qid);
                    const idx = parseInt(el.dataset.idx);
                    const q = allQuestions.find(item => item.id === qid);
                    if (!q || answeredMap.has(qid)) return;
                    answeredMap.set(qid, {selected: idx, correct: idx === q.answer});
                    render();
                });
            });
        }

        function updateStats() {
            const total = allQuestions.length;
            const answered = answeredMap.size;
            let correct = 0;
            answeredMap.forEach(v => { if(v.correct) correct++; });

            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressText').textContent = `${answered}/${total}`;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('accuracyText').textContent = answered ? Math.round(correct/answered*100) + '%' : '0%';
        }

        // 筛选按钮
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    })();
</script>
